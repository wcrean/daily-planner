<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>Daily Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="locationLabel">Morristown, NJ</p>
        <h1 id="greeting">Good afternoon, Bill</h1>
        <p class="date" id="dateLabel">Wednesday, September 9</p>
      </div>
      <button id="locationButton" class="icon-button" type="button" aria-label="Use my current location" title="Use my current location">⌖</button>
    </header>

    <section class="weather-panel" aria-labelledby="weatherHeading">
      <div class="section-heading-row">
        <h2 id="weatherHeading">Weather</h2>
        <span class="status-pill" id="weatherStatus">Sample data</span>
      </div>

      <div class="weather-summary">
        <div>
          <div class="temperature-row">
            <span class="weather-icon" aria-hidden="true">⛅</span>
            <span class="temperature">72°</span>
          </div>
          <p class="conditions">Partly cloudy</p>
        </div>
        <div class="weather-details">
          <p><strong>78°</strong> high</p>
          <p><strong>61°</strong> low</p>
          <p><strong>20%</strong> rain</p>
        </div>
      </div>

      <div class="hourly-strip" aria-label="Hourly weather preview">
        <div class="hour"><span>Now</span><strong>72°</strong></div>
        <div class="hour"><span>3 PM</span><strong>75°</strong></div>
        <div class="hour"><span>5 PM</span><strong>76°</strong></div>
        <div class="hour"><span>7 PM</span><strong>70°</strong></div>
      </div>
    </section>

    <section class="agenda-section" aria-labelledby="agendaHeading">
      <div class="section-heading-row">
        <h2 id="agendaHeading">Today</h2>
        <span class="status-pill" id="agendaStatus">Sample agenda</span>
      </div>

      <div class="agenda-list" id="agendaList" aria-live="polite">
        <div class="empty-state">Loading your Cozi agenda…</div>
      </div>
    </section>

    <p class="footer-note">v0.3.0 — live Cozi agenda; live weather comes next.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
