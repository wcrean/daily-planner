<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>Daily Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="locationLabel">Finding your location…</p>
        <h1 id="greeting">Good afternoon, Bill</h1>
        <p class="date" id="dateLabel">Wednesday, September 9</p>
      </div>
      <button id="locationButton" class="icon-button" type="button" aria-label="Use my current location" title="Use my current location">⌖</button>
    </header>

    <section class="weather-panel" aria-labelledby="weatherHeading">
      <div class="section-heading-row">
        <h2 id="weatherHeading">Weather</h2>
        <span class="status-pill" id="weatherStatus">Loading…</span>
      </div>

      <div class="weather-summary">
        <div>
          <div class="temperature-row">
            <span class="weather-icon" id="weatherIcon" aria-hidden="true">—</span>
            <span class="temperature" id="currentTemp">—°</span>
          </div>
          <p class="conditions" id="conditions">Loading current conditions…</p>
        </div>
        <div class="weather-details">
          <p><strong id="highTemp">—°</strong> high</p>
          <p><strong id="lowTemp">—°</strong> low</p>
          <p><strong id="rainChance">—%</strong> rain</p>
        </div>
      </div>

      <div class="hourly-strip" id="hourlyStrip" aria-label="Hourly weather preview">
        <div class="hour"><span>Now</span><strong>—°</strong></div>
        <div class="hour"><span>Later</span><strong>—°</strong></div>
        <div class="hour"><span>Later</span><strong>—°</strong></div>
        <div class="hour"><span>Later</span><strong>—°</strong></div>
      </div>
    </section>

    <section class="agenda-section" aria-labelledby="agendaHeading">
      <div class="section-heading-row">
        <h2 id="agendaHeading">Today</h2>
        <span class="status-pill" id="agendaStatus">Loading…</span>
      </div>

      <div class="agenda-list" id="agendaList" aria-live="polite">
        <div class="empty-state">Loading your Cozi agenda…</div>
      </div>
    </section>

    <p class="footer-note">v0.4.0 — live Cozi agenda + live location-aware weather.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
